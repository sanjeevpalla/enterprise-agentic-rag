[project]
name = "enterprise-agentic-rag"
version = "0.1.0"
description = "Agentic RAG assistant over enterprise documents: hybrid retrieval, cited and grounded answers, guardrails, web UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.0",
    "en-core-web-lg",
    "fastapi>=0.142.4",
    "fastembed>=0.9.0",
    "guardrails-ai>=0.11.0",
    "guardrails-ai-detect-jailbreak>=0.1.6",
    "guardrails-ai-detect-pii>=0.0.6",
    "guardrails-ai-secrets-present>=0.1.0",
    "guardrails-ai-toxic-language>=0.0.2",
    "langchain>=1.4.3",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-openai>=1.6.7",
    "langchain-pymupdf4llm>=1.28",
    "langchain-qdrant>=1.1",
    "langchain-text-splitters>=1.0",
    "langfuse>=4.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3",
    "openpyxl>=3.1",
    "pydantic-settings>=2.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "qdrant-client>=1.12",
    "tiktoken>=0.7",
    "typesafe-sdk>=0.7.2",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
eval = [
    "deepeval>=4.2.8",
]
